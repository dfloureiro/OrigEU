<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OrigEU</title>
<style>
  body {
    width: 230px;
    margin: 0;
    padding: 14px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1a1a1a;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 2px;
  }
  .version {
    font-size: 10px;
    color: #999;
  }
  p.sub {
    font-size: 11px;
    color: #666;
    margin: 0 0 12px;
  }
  label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 7px 0;
    cursor: pointer;
    border-top: 1px solid #eee;
  }
  label:first-of-type {
    border-top: none;
  }
  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 7px;
    font-size: 12px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    color: #333;
  }
  button:active {
    background: #e4e4e4;
  }
  p.hint {
    font-size: 10px;
    color: #888;
    margin: 4px 0 0;
  }
  .field {
    border-top: 1px solid #eee;
    padding: 7px 0;
  }
  .field p.label {
    font-size: 13px;
    margin: 0 0 6px;
  }
  select {
    width: 100%;
    font-size: 12px;
    padding: 5px;
    border-radius: 6px;
    border: 1px solid #ddd;
    color: #333;
  }
  .donate {
    display: block;
    text-align: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #eee;
    font-size: 12px;
    color: #666;
    text-decoration: none;
  }
  .donate:hover {
    color: #1a1a1a;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="title-row">
    <h1>OrigEU</h1>
    <span class="version" id="version"></span>
  </div>
  <p class="sub" data-i18n="popupSubtitle"></p>
  <label><input type="checkbox" id="eu" checked> <span data-i18n="popupToggleEu"></span></label>
  <div class="field">
    <p class="label" data-i18n="popupDetailStyleLabel"></p>
    <select id="detail">
      <option value="long" data-i18n="popupDetailLong"></option>
      <option value="short" data-i18n="popupDetailShort"></option>
    </select>
  </div>
  <button id="clearCache" type="button" data-i18n="popupClearCache"></button>
  <p class="hint" id="clearCacheHint" data-i18n="popupClearCacheHint"></p>
  <a class="donate" href="https://liberapay.com/dfloureiro/donate" target="_blank" rel="noopener noreferrer" data-i18n="popupDonate"></a>
  <script type="module" src="popup.js"></script>
</body>
</html>
